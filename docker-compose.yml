services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-plata_clara}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde TU máquina (127.0.0.1), nunca desde la red.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plata} -d ${POSTGRES_DB:-plata_clara}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-plata}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plata_clara}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env (mínimo 32 caracteres)}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8080:8080"
    read_only: true            # el sistema de archivos del contenedor no se puede modificar
    cap_drop: [ALL]            # sin capacidades especiales de Linux
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
